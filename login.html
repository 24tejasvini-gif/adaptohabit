<!DOCTYPE html>
<html>
    <head>
        <title>
            AdaptoHabit - Welcome
        </title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body class = "auth-body">
        <div class = "auth-container ">
                <div class ="auth-header">
                <p class="auth-subtitle">Adapt your daily routine , Shape your future</p>
            </div>

            <div class = "auth-tabs">
                <button type="button" class="tab-btn active" id="login-tab" onclick="switchForm('login')">Login</button> 
                <button type="button" class="tab-btn" id="register-tab" onclick="switchForm('register')">Register</button>
            </div>

            <!--login-form-->
        <form id="login-form" class="auth-form active-form" action="/login" method="POST">
            <div class="form-group">
                <label for="login-email">Email Address</label>
                <input type="email" id="login-email" placeholder="email" required>
            </div>
        <div class="form-group">
            <label for ="login-password">Password</label>
            <input type="password" id="login-password" placeholder="password" required>
        </div>
            <button type="submit" class="btn-primary auth-submit-btn">Sign-In</button>
        </form>
        
        <!--Register form-->
        <form id="register-form" class="auth-form" action="/register" method="POST">
            <div class="form-group">
                <label for="user-name">Full Name</label>
                <input type="text" id="user-name" placeholder="user name" required>
            </div>
            <div class="form-group">
                <label for="register-email">Email Address</label>
                <input type="email" id="register-email" placeholder="email" required>
            <div class="form-group">
                <label for="register-password">Password</label>                 
                  <input type="password" id="password" placeholder="password" required>
            </div>
            <button type="submit" class="btn-primary auth-submit-btn">Register</button>
            </div>
            </form>
         <script src="script.js"></script>  
    </body>
</html>
